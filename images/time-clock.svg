<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BA8FF"/>
      <stop offset="50%" stop-color="#9B6CFF"/>
      <stop offset="100%" stop-color="#FF6CCF"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BA8FF"/>
      <stop offset="100%" stop-color="#9B6CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 外圈光晕 -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.35" filter="url(#glow)"/>
  <!-- 主表盘外圈 -->
  <circle cx="16" cy="16" r="13" fill="url(#faceGrad)" stroke="url(#ringGrad)" stroke-width="2.2"/>
  <!-- 12/3/6/9 点位 -->
  <circle cx="16" cy="4.5" r="1.2" fill="#9B6CFF"/>
  <circle cx="27.5" cy="16" r="1.2" fill="#FF6CCF"/>
  <circle cx="16" cy="27.5" r="1.2" fill="#5BA8FF"/>
  <circle cx="4.5" cy="16" r="1.2" fill="#9B6CFF"/>
  <!-- 时针（指向 10 点位置） -->
  <line x1="16" y1="16" x2="10" y2="11" stroke="url(#handGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 分针（指向 2 点位置） -->
  <line x1="16" y1="16" x2="22" y2="13" stroke="#FF6CCF" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 秒针（指向 12 点位置） -->
  <line x1="16" y1="16" x2="16" y2="6" stroke="#FFB45B" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 中心点 -->
  <circle cx="16" cy="16" r="1.6" fill="url(#handGrad)"/>
  <circle cx="16" cy="16" r="0.7" fill="#FFFFFF"/>
</svg>
